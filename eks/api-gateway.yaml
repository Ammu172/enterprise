apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-gateway
  namespace: finbank

spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway
          image: ammu172/finbank-api-gateway:1.1

          ports:
            - containerPort: 8084

          volumeMounts:
            - name: finbank-config
              mountPath: /etc/finbank
              readOnly: true

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 384Mi

      volumes:
        - name: finbank-config
          secret:
            secretName: finbank-config
