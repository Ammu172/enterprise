apiVersion: apps/v1
kind: Deployment

metadata:
  name: finbank-frontend
  namespace: finbank

spec:
  replicas: 1

  selector:
    matchLabels:
      app: finbank-frontend

  template:
    metadata:
      labels:
        app: finbank-frontend

    spec:
      containers:
        - name: finbank-frontend
          image: ammu172/finbank-frontend:1.0

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
