
spring.application.name=customer-service

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://172.20.0.1:5432/finbank
spring.datasource.username=finbank_app
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.config.import=optional:file:/etc/finbank/finbank.env[.properties]
internal.service.account-token=${ACCOUNT_CUSTOMER_SERVICE_TOKEN}
logging.level.org.springframework.security=TRACE
account.service.url=http://account-service:8081
internal.service.account-creation-token=${CUSTOMER_ACCOUNT_SERVICE_TOKEN}
