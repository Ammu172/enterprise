spring.application.name=api-gateway

server.port=8084

# Customer Service
spring.cloud.gateway.server.webflux.routes[0].id=customer-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/customers/**
spring.cloud.gateway.server.webflux.routes[0].uri=http://customer-service:8080


# Account Service
spring.cloud.gateway.server.webflux.routes[1].id=account-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/accounts/**
spring.cloud.gateway.server.webflux.routes[1].uri=http://account-service:8081

# Transaction Service
spring.cloud.gateway.server.webflux.routes[2].id=transaction-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/transactions/**
spring.cloud.gateway.server.webflux.routes[2].uri=http://transaction-service:8082



# Notification Service
spring.cloud.gateway.server.webflux.routes[3].id=notification-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/notifications/**
spring.config.import=optional:file:/etc/finbank/finbank.env[.properties]
spring.cloud.gateway.server.webflux.routes[3].uri=http://notification-service:8083


# Authentication routes
spring.cloud.gateway.server.webflux.routes[4].id=auth-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[4].uri=http://customer-service:8080
# Actuator Health Check
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
