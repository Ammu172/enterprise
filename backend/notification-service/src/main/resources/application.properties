spring.application.name=notification-service

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://172.20.0.1:5432/finbank
spring.datasource.username=finbank_app
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8083

# Load secure environment variables
spring.config.import=optional:file:/etc/finbank/finbank.env[.properties]

# JWT Resource Server Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=finbank
